<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Regular</title>

    <!-- Shared assets (required by task) -->
    <link rel="stylesheet" href="./common.css" />
    <script defer src="./app.js"></script>

    <!-- Screen-specific styles -->
    <link rel="stylesheet" href="./regular.css" />
  </head>

  <body>
    <main class="regular-screen" role="main" aria-label="Regular screen">
      <section class="regular-card" aria-label="Regular content">
        <header class="regular-header">
          <h1 class="regular-title">Regular</h1>
          <p class="regular-subtitle">
            This screen is staged. The provided Figma attachments were not present in the workspace, so exact
            layout/styles could not be generated yet.
          </p>
        </header>

        <div class="regular-actions" aria-label="Actions">
          <button class="regular-btn" type="button">
            Primary action
          </button>
          <button class="regular-btn regular-btn--secondary" type="button">
            Secondary action
          </button>
        </div>

        <p class="regular-note">
          Asset reference convention for this folder: <code>./figmaimages/your-image.png</code>
        </p>
      </section>
    </main>

    <noscript>
      This page requires JavaScript for full interactivity.
    </noscript>
  </body>
</html>
